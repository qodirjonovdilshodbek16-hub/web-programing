<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse all TechNest products. Search, filter by category and sort by price or rating.">
  <title>Shop — TechNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header>
    <div class="bar">
      <a class="logo" href="index.html">Tech<span>Nest</span></a>
      <nav id="mainNav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html" aria-current="page">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="tools-right">
        <a class="icon-btn cart-link" href="cart.html" aria-label="Open cart" style="display:grid;place-items:center;text-decoration:none">🛒<span id="cartCount" class="cart-count">0</span></a>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch to dark mode">🌙</button>
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mainNav">☰</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="block">
      <div class="wrap">
        <p class="eyebrow">Catalog</p>
        <h1 style="font-size:clamp(2rem,5vw,3rem)">All products</h1>

        <div class="toolbar">
          <div class="search">
            <label for="q" class="muted" style="font-size:.85rem">Search</label>
            <input id="q" type="search" placeholder="Search products, e.g. headphones" autocomplete="off">
          </div>
          <div>
            <label for="sort" class="muted" style="font-size:.85rem">Sort by</label>
            <select id="sort">
              <option value="featured">Featured</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="rating">Best rated</option>
              <option value="name">Name A–Z</option>
            </select>
          </div>
        </div>

        <div class="chips" id="chips" role="group" aria-label="Filter by category" style="margin-top:16px"></div>

        <p class="result-count" id="count" aria-live="polite"></p>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty">
          <p style="font-size:2.4rem">🔍</p>
          <p>No products match your search.</p>
          <button class="btn ghost" type="button" id="reset">Clear filters</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© <span id="year">2026</span> TechNest · A demo store made for a Web Programming course. No real purchases are made.</p>
  </footer>

  <script src="products.js"></script>
  <script src="main.js"></script>
  <script src="shop.js"></script>
</body>
</html>
